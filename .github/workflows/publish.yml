name: Test and Publish Python Package

# Runs the offline test suite on every push to main and on pull requests.
# On a push to main, publishes to PyPI once the tests pass, using an API token
# stored in the PYPI_API_TOKEN repository secret. skip-existing avoids failing
# the run when __version__ in ftgo/__init__.py has not been bumped.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          # Python 3.9 is not available on the Ubuntu 26.04 (ubuntu-latest) runners
          - os: ubuntu-24.04
            python-version: '3.9'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install . pytest

    - name: Run tests
      run: python -m pytest

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
