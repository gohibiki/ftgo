name: Publish Python Package

# Publishes to PyPI via Trusted Publishing (OIDC) when a version tag is pushed.
# No API token is used; PyPI verifies the workflow's OIDC identity instead.
# Trusted publisher on PyPI must be registered with:
#   owner: gohibiki  repo: ftgo  workflow: publish.yml  environment: (none)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # REQUIRED for trusted publishing (OIDC)

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
